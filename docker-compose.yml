version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: dynamic-portfolio-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: nishant
      MONGO_INITDB_ROOT_PASSWORD: nishant
      MONGO_INITDB_DATABASE: dynamic-portfolio
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
